<html lang="en">
<head>
    <!--

                      - Persistent, state-retaining client-side SPA routing via localStorage
                      - Adaptive dual-theme architecture with auto-updating icons and text
                      - Micro-interactions & animations on cards and interactive buttons
                      - Secure external link routing using strict isolation protocols
                      - Stateful inline JavaScript Computer Science Random Fact Engine
    =======================================================================

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bozi Dape Portfolio</title>
    <style>
        /* --- DESIGN SYSTEM & CSS VARIABLES --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4f8, #d9e2ec);
            --text-color: #102a43;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.4);
            --accent-color: #2e75b6;
            --accent-gradient: linear-gradient(45deg, #2e75b6, #1992d4);
            --shadow-color: rgba(16, 42, 67, 0.08);
            --nav-bg: rgba(255, 255, 255, 0.7);
            --card-hover: rgba(255, 255, 255, 0.95);
        }

        body.dark-theme {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b);
            --text-color: #f1f5f9;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(45deg, #38bdf8, #818cf8);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --nav-bg: rgba(30, 41, 59, 0.6);
            --card-hover: rgba(30, 41, 59, 0.85);
        }

        /* --- GLOBAL RESETS & BASE STYLES --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 1.7;
            min-height: 100vh;
            padding-bottom: 60px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* --- FLOATING PILL HEADER --- */
        .global-header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px var(--shadow-color);
            z-index: 1000;
            transition: background 0.3s ease, border 0.3s ease;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background: rgba(128, 128, 128, 0.15);
        }

        .nav-btn.active {
            background: var(--accent-color);
            color: #ffffff;
        }

        body.dark-theme .nav-btn.active {
            color: #0f172a;
            font-weight: 600;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .theme-toggle:hover {
            transform: scale(1.05);
            background: var(--card-hover);
        }

        /* --- LAYOUT CONFIGURATION --- */
        .container {
            width: 90%;
            max-width: 800px;
            margin: 120px auto 40px auto;
        }

        .view-section {
            display: none;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- GLASSMORPHIC CARDS --- */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px var(--shadow-color);
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-2px);
            background: var(--card-hover);
            box-shadow: 0 12px 40px var(--shadow-color);
        }

        /* --- TYPOGRAPHY ELEMENTS --- */
        h1.gradient-heading {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 24px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        h2 {
            font-size: 1.4rem;
            margin-bottom: 12px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        p {
            margin-bottom: 16px;
            font-size: 1.05rem;
        }

        /* --- LISTS & TRACKERS --- */
        ul {
            list-style: none;
        }

        li {
            position: relative;
            padding-left: 24px;
            margin-bottom: 12px;
        }

        li::before {
            content: "✦";
            position: absolute;
            left: 0;
            color: var(--accent-color);
        }

        /* --- BUTTONS & INTERACTIVE LINKS --- */
        .inline-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: border-color 0.3s ease;
        }

        .inline-link:hover {
            border-color: var(--accent-color);
        }

        .card-link-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 10px 20px;
            background: var(--accent-gradient);
            color: #ffffff !important;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        body.dark-theme .card-link-wrapper {
            color: #0f172a !important;
        }

        .card-link-wrapper:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px var(--shadow-color);
        }

        .action-btn {
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: all 0.3s ease;
            margin-top: 12px;
        }

        body.dark-theme .action-btn {
            color: #0f172a;
        }

        .action-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .fact-display {
            margin-top: 16px;
            padding: 16px;
            background: rgba(128, 128, 128, 0.08);
            border-left: 4px solid var(--accent-color);
            border-radius: 0 8px 8px 0;
            font-style: italic;
            min-height: 56px;
        }

        /* --- MOBILE STYLING RESPONSIVENESS --- */
        @media (max-width: 600px) {
            .global-header {
                width: 95%;
                padding: 6px 12px;
            }
            .nav-btn {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            .theme-toggle {
                padding: 6px 10px;
                font-size: 0.75rem;
            }
            .container {
                margin-top: 100px;
            }
            h1.gradient-heading {
                font-size: 2rem;
            }
        }
    </style>
</head>
